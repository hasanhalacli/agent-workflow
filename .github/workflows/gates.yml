name: gates
on:
  pull_request:
  push:
    branches: [main]

jobs:
  security-and-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks scans full history

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5

      - name: No version ranges in dependencies
        run: '! grep -nE "\"[A-Za-z0-9._-]+(>=|~=|\^)" sample-app/pyproject.toml'

      - name: Lockfile matches pyproject
        working-directory: sample-app
        run: uv lock --check

      - name: Known-vulnerability audit
        working-directory: sample-app
        run: |
          uv export --no-hashes --no-dev -o /tmp/reqs.txt
          uvx pip-audit -r /tmp/reqs.txt

      - name: Tests
        working-directory: sample-app
        run: |
          uv sync
          uv run pytest -q
